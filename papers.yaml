extremes:
  authors: Bhatia & Ganguly
  year: 2019
  title: Precipitation extremes and depth-duration-frequency under internal climate variability
  journal: Scientific Reports
  url: https://www.nature.com/articles/s41598-019-45673-3
  doi: 10.1038/s41598-019-45673-3
  support: >-
    The study uses initial-condition ensembles to examine precipitation extremes and return
    levels. Combining member information can reduce sampling uncertainty under the study's
    distributional assumptions.
  scope: >-
    CESM large-ensemble analysis. Pooling members in another application requires checking
    the assumptions.
value:
  authors: Maraun et al.
  year: 2019
  title: >-
    Statistical downscaling skill under present climate conditions: A synthesis of the VALUE
    perfect predictor experiment
  journal: International Journal of Climatology
  url: https://rmets.onlinelibrary.wiley.com/doi/10.1002/joc.5877
  doi: 10.1002/joc.5877
  support: >-
    VALUE evaluates multiple aspects of downscaling skill, including variability and
    dependence. Performance for one statistic does not establish skill for all
    application-relevant features.
  scope: >-
    Present-climate perfect-predictor evaluation. Future transfer and errors in driving
    climate models need additional assessment.
hartke-gard-lens:
  authors: Hartke et al.
  year: 2024
  title: >-
    GARD-LENS: A downscaled large ensemble dataset for understanding future climate and its
    uncertainties
  journal: Scientific Data
  doi: 10.1038/s41597-024-04205-z
  url: https://www.nature.com/articles/s41597-024-04205-z
  support: >-
    Documents a 200-member downscaled ensemble from three CMIP6 models and comparisons with
    other products.
  scope: >-
    Historical and SSP3-7.0 ensemble. Three parent models do not represent the full range of
    model or scenario uncertainty.
gergel-gdpcir:
  authors: Gergel et al.
  year: 2024
  title: >-
    Global Downscaled Projections for Climate Impacts Research (GDPCIR): preserving quantile
    trends for modeling future climate impacts
  journal: Geoscientific Model Development
  doi: 10.5194/gmd-17-191-2024
  url: https://gmd.copernicus.org/articles/17/191/2024/
  support: Describes QDM bias adjustment followed by QPLAD spatial downscaling for 25 CMIP6 models.
  scope: >-
    2024 dataset description. Preservation of modeled quantile changes is not evidence that
    those future changes are correct.
pierce-loca:
  authors: Pierce et al.
  year: 2014
  title: Statistical Downscaling Using Localized Constructed Analogs (LOCA)
  journal: Journal of Hydrometeorology
  doi: 10.1175/JHM-D-14-0082.1
  url: https://doi.org/10.1175/JHM-D-14-0082.1
  support: Introduces localized constructed analog downscaling.
  scope: >-
    Original method; distinguish CMIP5 LOCA products, evaluation regridding, and later LOCA2
    releases.
pierce-loca2:
  authors: Pierce et al.
  year: 2023
  title: Future Increases in North American Extreme Precipitation in CMIP6 Downscaled with LOCA
  journal: Journal of Hydrometeorology
  url: >-
    https://cirrus.ucsd.edu/~pierce/papers/Pierce_et_al_JHM_2023_LOCA2_precip_extremes_VoR.pdf
  doi: 10.1175/JHM-D-22-0194.1
  support: >-
    Describes LOCA2 downscaling and North American daily precipitation extremes from 27
    CMIP6 models.
  scope: >-
    The 2023 study predates the precipitation update v20240915. Findings are not a
    validation of every application or later release.
abatzoglou-maca:
  authors: Abatzoglou and Brown
  year: 2012
  title: A comparison of statistical downscaling methods suited for wildfire applications
  journal: International Journal of Climatology
  doi: 10.1002/joc.2312
  url: https://rmets.onlinelibrary.wiley.com/doi/10.1002/joc.2312
  support: Describes and compares the MACA method for wildfire-relevant meteorology.
  scope: >-
    Method paper, published online in 2011 and in the 2012 journal volume. Archive coverage
    comes from the MACAv2 provider documentation.
bukovsky-na-cordex:
  authors: Bukovsky and Mearns
  year: 2020
  title: >-
    Regional climate change projections from NA-CORDEX and their relation to climate
    sensitivity
  journal: Climatic Change
  doi: 10.1007/s10584-020-02835-x
  url: https://link.springer.com/article/10.1007/s10584-020-02835-x
  support: >-
    Analyzes NA-CORDEX regional projections and their relation to parent-model climate
    sensitivity.
  scope: >-
    RCP8.5 experiments available at the time of the study, not every archive configuration
    or later release.
thrasher:
  authors: Thrasher et al.
  year: 2022
  title: NASA Global Daily Downscaled Projections, CMIP6
  journal: Scientific Data
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9163132/
  doi: 10.1038/s41597-022-01393-4
  support: >-
    Describes the original NEX-GDDP-CMIP6 archive and its
    bias-correction/spatial-disaggregation method.
  scope: The 2022 archive description; later versions require their own release notes.
thrasher-dcp30:
  authors: Thrasher et al.
  year: 2013
  title: Downscaled Climate Projections Suitable for Resource Management
  journal: Eos, Transactions American Geophysical Union
  doi: 10.1002/2013EO370002
  url: https://doi.org/10.1002/2013EO370002
  support: NEX-DCP30 publication cited by the Earth Engine distribution catalog.
  scope: >-
    Bibliographic metadata checked in the distributor citation. Full text was not retrieved
    in this catalog update; technical claims use the NASA documentation.
thrasher-temperature:
  authors: Thrasher et al.
  year: 2012
  title: >-
    Technical Note: Bias correcting climate model simulated daily temperature extremes with
    quantile mapping
  journal: Hydrology and Earth System Sciences
  doi: 10.5194/hess-16-3309-2012
  url: https://hess.copernicus.org/articles/16/3309/2012/
  support: >-
    Describes quantile-mapping treatment of daily temperature extremes and is cited by the
    NEX-GDDP distributor.
  scope: >-
    Temperature methods paper; it does not establish precipitation skill or all metadata for
    the NEX-GDDP archive.
jones-tgw:
  authors: Jones et al.
  year: 2023
  title: >-
    Continental United States climate projections based on thermodynamic modification of
    historical weather
  journal: Scientific Data
  doi: 10.1038/s41597-023-02485-5
  url: https://www.nature.com/articles/s41597-023-02485-5
  support: >-
    Documents WRF simulations that repeat historical weather with four thermodynamic warming
    trajectories.
  scope: >-
    Conditional warming experiments using a repeated 40-year weather sequence, not
    independently generated future weather realizations.
rahimi-wus-d3:
  authors: Rahimi et al.
  year: 2024
  title: An overview of the Western United States Dynamically Downscaled Dataset (WUS-D3)
  journal: Geoscientific Model Development
  doi: 10.5194/gmd-17-2265-2024
  url: https://gmd.copernicus.org/articles/17/2265/2024/
  support: Describes 16 WRF simulations driven by 14 CMIP6 models and evaluates western US climate.
  scope: >-
    Original 2024 ensemble with uncorrected GCM forcing; later bias-corrected experiments
    require separate evaluation.
gebrechorkos-bccaq:
  authors: Gebrechorkos et al.
  year: 2023
  title: >-
    A high-resolution daily global dataset of statistically downscaled CMIP6 models for
    climate impact analyses
  journal: Scientific Data
  url: https://www.nature.com/articles/s41597-023-02528-x
  doi: 10.1038/s41597-023-02528-x
  support: Describes the global BCCAQ dataset, references, models, time periods and scenarios.
  scope: Dataset properties, not a universal regional skill ranking.
